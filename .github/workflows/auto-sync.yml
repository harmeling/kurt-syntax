name: Auto-sync with kurt-lang

# Triggered by kurt-lang's release.yml (job notify-kurt-syntax) via repository_dispatch whenever a
# new Kurt version is released. Regenerates completions.json against that release; if nothing
# changed (no keyword added or removed), there is nothing to publish and the run ends quietly. If
# something did change, bumps this extension's own patch version, commits, and pushes a new tag --
# which the existing release.yml (on: push: tags) then builds, packages, and publishes exactly as
# a manual release would, with no further change to that file.
#
# `npm run check` must still pass after regenerating completions.json: syntaxes/kurt.tmLanguage.json,
# kurt-mode.el, and syntax/kurt.vim are hand-maintained, not generated, so a new keyword needs a
# human decision about which highlighting group it belongs in. When that happens, this workflow
# fails loudly instead of publishing an extension with incomplete syntax highlighting -- fix the
# three files by hand (see check_editor_support.py's output), push to main, then either re-tag by
# hand or wait for the next kurt-lang release to retrigger this workflow.
#
# Needs the secret KURT_SYNTAX_RELEASE_PAT: a fine-grained PAT scoped to just this repository,
# Contents: Read and write. The default GITHUB_TOKEN could push the commit and tag just as well,
# but a push made with it does not retrigger other workflows (including this repository's own
# release.yml) -- which would silently swallow the release.

on:
  repository_dispatch:
    types: [kurt-lang-released]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.KURT_SYNTAX_RELEASE_PAT }}

      - name: Check out the released kurt-lang (${{ github.event.client_payload.tag }})
        uses: actions/checkout@v4
        with:
          repository: harmeling/kurt-lang
          ref: ${{ github.event.client_payload.tag }}
          path: kurt-lang

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci

      - name: Regenerate completions.json against the released kurt-lang
        env:
          KURT_LANG_PATH: ${{ github.workspace }}/kurt-lang
        run: python3 scripts/generate_completions.py

      - name: Nothing to publish if completions.json didn't change
        id: diff
        run: |
          if git diff --quiet -- completions.json; then
            echo "Kurt ${{ github.event.client_payload.version }} added no keyword kurt-syntax doesn't already cover."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check that the editors still cover Kurt's current keywords
        if: steps.diff.outputs.changed == 'true'
        env:
          KURT_LANG_PATH: ${{ github.workspace }}/kurt-lang
        run: npm run check

      - name: Bump the version, commit, and tag
        if: steps.diff.outputs.changed == 'true'
        env:
          GIT_AUTHOR_NAME: kurt-lang release bot
          GIT_AUTHOR_EMAIL: actions@github.com
          GIT_COMMITTER_NAME: kurt-lang release bot
          GIT_COMMITTER_EMAIL: actions@github.com
        run: |
          new_version=$(npm version patch --no-git-tag-version | sed 's/^v//')
          git add completions.json package.json package-lock.json
          git commit -m "Sync with Kurt ${{ github.event.client_payload.version }}"
          git tag "v$new_version"
          git push origin HEAD:main
          git push origin "v$new_version"
