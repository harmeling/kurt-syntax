name: CI

on:
  push:
  pull_request:

env:
  # scripts/check_editor_support.py and generate_completions.py read Kurt's current keywords from
  # here. Deliberately the private, ahead-of-release kurt-lang-dev, not the public kurt-lang
  # mirror: the mirror lags behind by design (it only moves on a publish), so checking against it
  # would flag every keyword added since the last release as "missing" from the editor support.
  KURT_LANG_PATH: ${{ github.workspace }}/kurt-lang-dev

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # harmeling/kurt-lang-dev is private: a fine-grained PAT (Contents: Read-only, scoped to
      # just that repository) as the secret KURT_LANG_DEV_PAT -- the default GITHUB_TOKEN can
      # only read the repository the workflow itself runs in.
      - name: Check out kurt-lang-dev (for scripts/check_editor_support.py)
        uses: actions/checkout@v4
        with:
          repository: harmeling/kurt-lang-dev
          path: kurt-lang-dev
          token: ${{ secrets.KURT_LANG_DEV_PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci

      - name: Build (type-check, then bundle the extension)
        run: npm run build

      - name: Check that the editors cover Kurt's current keywords
        run: npm run check

      - name: Package the .vsix (packaging must succeed; the result is not published)
        run: npx vsce package --out /tmp/kurt-syntax-ci.vsix
